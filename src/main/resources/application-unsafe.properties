spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# The H2 console is a full, unauthenticated web SQL client, and web-allow-others exposed it off
# the loopback interface. Combined with the datasource credentials committed above it granted
# arbitrary read and write over auth_users, idor_users, the session table and the vault, which
# routes around the storage-side hardening rather than defeating it directly. It was kept on here
# because the crypto level text told players to open /h2 and read the stored value; that text has
# since been removed along with the account it described, so nothing depends on it any more.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
