spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# The H2 console is the instrumentation the challenges themselves rely on - several level hints
# read "open the H2 console (/h2) and look at the stored value". It is a full SQL client and in a
# real deployment it has no business being reachable, which is why the public profile disables it;
# this profile is the deliberately unsafe one, and turning it off here removed the app's intended
# way of inspecting the database without closing any of the scored vulnerabilities.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
