<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The reset token travels in this page's query string, so the page URL is itself a credential.
      "unsafe-url" told the browser to attach that full URL, token and all, as the Referer on every
      request the page makes, handing the token to any third party the page touches and writing it
      into their access logs. "no-referrer" is the only policy that keeps a tokenised URL out of
      requests to other origins, so it is set here rather than a same-origin relaxation.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>VulnerableApp - Reset Password</title>
    <link rel="stylesheet" href="reset.css" />
</head>
<body>
    <div class="reset-shell">
        <div class="reset-card">
            <span id="resetLevelBadge" class="reset-badge">Password Reset</span>
            <h1 id="resetTitle" class="reset-title">Choose a new password</h1>
            <p id="resetSubtitle" class="reset-subtitle">This page was opened from an emailed reset link. Enter a new password and submit it for backend validation.</p>

            <div class="reset-field">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter a new password" autocomplete="new-password" />
            </div>

            <button id="applyResetBtn" class="reset-button">Reset Password</button>

            <div id="level7ExternalCard" class="external-card hidden">
                <h5>External Resource</h5>
                <p class="external-copy">This third-party resource is loaded with a no-referrer policy, so the reset-link URL is not sent to it.</p>
                <img
                    id="level7ExternalImage"
                    class="external-image"
                    src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
                    referrerpolicy="no-referrer"
                    alt="Third-party image loaded without a referrer"
                />
            </div>

            <div id="resultCard" class="result-card hidden">
                <div class="result-head">
                    <h5>Result</h5>
                    <span id="resultStatus" class="result-badge">Unknown</span>
                </div>
                <p id="resultMessage" class="result-message"></p>
                <div id="resultDetails" class="result-details"></div>
            </div>
        </div>
    </div>

    <script src="reset.js"></script>
</body>
</html>
